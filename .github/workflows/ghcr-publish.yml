name: Build and Publish to GHCR

on:
  push:
    branches:
      - fix-rescan-folders-author-scope
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cross
          platforms: linux/amd64
          push: true
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:patched
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image as tarball artifact
        run: docker save ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:patched -o chaptarr-patched.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: chaptarr-patched-image
          path: chaptarr-patched.tar
          retention-days: 3
